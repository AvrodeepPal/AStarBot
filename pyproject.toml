[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "astarbot"
version = "2.0.0"
description = "RAG-based portfolio chatbot — grounded, bounded, stateless"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pinecone>=5.0.0",
    "sentence-transformers>=2.6.1",
    "torch>=2.2.0",
    "langchain-core>=0.2.0",
    "langchain-groq>=0.1.5",
    "tqdm>=4.66.0",
    "streamlit>=1.33.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "ruff>=0.4.0"]

[tool.setuptools.packages.find]
include = ["rag*", "interfaces*", "scripts*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
